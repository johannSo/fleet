# Builds the all-in-one image (Dockerfile) for linux/amd64 and linux/arm64 and publishes it to
# ghcr.io/<owner>/fleet:
#   a published GitHub release vX.Y.Z  →  `latest`, `vX.Y.Z`, `X.Y` (the panel tells its users)
#   a push to main                     →  `main`, `sha-<commit>`
#   run by hand on another branch      →  `<branch>`, `sha-<commit>`
# Pull requests build it without publishing.
name: docker

on:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Versions
        id: v
        run: |
          git -C proxy/cliproxyapi fetch --quiet --tags --unshallow || git -C proxy/cliproxyapi fetch --quiet --tags
          echo "version=$(git -C proxy/cliproxyapi describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git -C proxy/cliproxyapi rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fleet" >> "$GITHUB_OUTPUT"
          # A release build is that release; others report package.json's version and their commit.
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then echo "fleet=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; fi
          echo "fleet_commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.v.outputs.image }}
          # `latest` is the newest (non-pre-)release, never a main build.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch,enable={{is_not_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CPA_VERSION=${{ steps.v.outputs.version }}
            CPA_COMMIT=${{ steps.v.outputs.commit }}
            FLEET_VERSION=${{ steps.v.outputs.fleet }}
            FLEET_COMMIT=${{ steps.v.outputs.fleet_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
